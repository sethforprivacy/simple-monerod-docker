name: "Test build of image when Dockerfile is changed"

on:
  push:
    paths:
    - 'Dockerfile'
    - 'entrypoint.sh'
    - 'healthcheck.sh'
    branches-ignore:
    - main
  pull_request:
    paths:
    - 'Dockerfile'
    - 'entrypoint.sh'
    - 'healthcheck.sh'
    - '.github/**'
  workflow_dispatch:

# Least-privilege default token (this workflow only reads the repo and pulls cache)
permissions:
  contents: read

# Cancel superseded runs for the same ref to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/simple-monerod

jobs:
  rebuild-container:
    name: "Build image with cache"
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare platform matrix for arm64
        if: runner.arch == 'ARM64'
        run: |
          echo "PLATFORM=linux/arm64" >> "$GITHUB_ENV"
          echo "DIGEST_NAME=arm64" >> "$GITHUB_ENV"
      - name: Prepare platform matrix for amd64
        if: runner.arch == 'X64'
        run: |
          echo "PLATFORM=linux/amd64" >> "$GITHUB_ENV"
          echo "DIGEST_NAME=amd64" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache compiler objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: monero-ccache
        with:
          path: ccache-monero
          key: ccache-monero-${{ env.DIGEST_NAME }}-${{ github.run_id }}
          restore-keys: |
            ccache-monero-${{ env.DIGEST_NAME }}-

      # BuildKit cache mounts are not persisted by registry/GHA layer caches;
      # this seeds restored objects into the /ccache mount and extracts them
      # again when the job finishes.
      - name: Seed compiler cache into the build
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: ccache-monero
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.monero-ccache.outputs.cache-hit }}
      - name: Test build of image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          platforms: ${{ env.PLATFORM }}
          tags: simple-monerod:testing
          cache-from: |
            type=registry,ref=${{ env.GHCR_REPO }}:buildcache-${{ env.DIGEST_NAME }}
            type=registry,ref=${{ env.GHCR_REPO }}:latest
      - name: Smoke-test built image
        uses: ./.github/actions/smoke-test
        with:
          image-ref: simple-monerod:testing
